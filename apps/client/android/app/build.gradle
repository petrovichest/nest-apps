import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def nestAppProvider = System.getenv('NEST_APP_PROVIDER')
if (nestAppProvider == null) nestAppProvider = 'codex'
if (!['codex', 'claude'].contains(nestAppProvider)) {
    throw new GradleException('NEST_APP_PROVIDER must be codex or claude')
}
def claude = nestAppProvider == 'claude'
def nestApplicationId = claude ? 'com.claudenest.app' : 'com.codexnest.app'
def nestStoragePrefix = claude ? 'claudenest' : 'codexnest'
def nestEventsPath = claude ? '/api/v1/ui/events' : '/api/v1/events'
def nestWebDir = claude ? 'dist-claude' : 'dist'

def packageVersion = new JsonSlurper().parse(file('../../../../package.json')).version as String
def codexNestVersionName = System.getenv('CODEXNEST_ANDROID_VERSION_NAME') ?: packageVersion
def codexNestVersionCode = Integer.parseInt(
    System.getenv('CODEXNEST_ANDROID_VERSION_CODE') ?: '2'
)

android {
    namespace = "com.codexnest.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId nestApplicationId
        buildConfigField 'String', 'STORAGE_PREFIX', '"' + nestStoragePrefix + '"'
        buildConfigField 'String', 'EVENTS_PATH', '"' + nestEventsPath + '"'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode codexNestVersionCode
        versionName codexNestVersionName
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('CODEXNEST_KEYSTORE_PATH')
            def keyAliasValue = System.getenv('CODEXNEST_KEY_ALIAS')
            def keyStorePassword = System.getenv('CODEXNEST_KEYSTORE_PASSWORD')
            def keyPasswordValue = System.getenv('CODEXNEST_KEY_PASSWORD')
            if (keyPath && keyAliasValue && keyStorePassword && keyPasswordValue) {
                storeFile file(keyPath)
                storePassword keyStorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('CODEXNEST_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    if (claude) {
        sourceSets {
            debug.res.srcDir 'src/claude/res'
            release.res.srcDir 'src/claude/res'
        }
    }
}

tasks.named('preBuild') {
    doFirst {
        def capacitorConfig = file('src/main/assets/capacitor.config.json')
        def publicIndex = file('src/main/assets/public/index.html')
        def syncCommand = claude ? 'android:sync:claude' : 'android:sync'
        def mismatchMessage = "Android assets do not match ${nestAppProvider}; run npm run ${syncCommand} -w @codexnest/client before building"
        if (!capacitorConfig.isFile() || !publicIndex.isFile()) {
            throw new GradleException(mismatchMessage)
        }
        def copiedConfig = new JsonSlurper().parse(capacitorConfig)
        def copiedClaude = (publicIndex.getText('UTF-8') =~ /<html\b[^>]*\bdata-application=["']claudenest["']/).find()
        if (copiedConfig.appId != nestApplicationId || copiedConfig.webDir != nestWebDir || copiedClaude != claude) {
            throw new GradleException(mismatchMessage)
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20250517'
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
