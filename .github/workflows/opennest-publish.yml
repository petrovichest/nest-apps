name: Publish qualified OpenNest

on:
  workflow_run:
    workflows: ["OpenNest qualification"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: opennest-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Publish only the independently qualified OpenNest artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          OPENNEST_CANDIDATE: ${{ github.event.workflow_run.head_sha }}
          QUALIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node deploy/opennest/publish.mjs
