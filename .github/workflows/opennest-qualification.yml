name: OpenNest native diagnostics

on:
  workflow_dispatch:
    inputs:
      diagnostic_scope:
        description: Baseline startup or full native lifecycle
        type: choice
        default: full
        options: [baseline, full]
      baseline_release:
        description: Optional published opennest-v tag to upgrade from
        type: string

permissions:
  contents: read

concurrency:
  group: opennest-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Find a published OpenNest ancestor
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASELINE_RELEASE: ${{ inputs.baseline_release }}
        run: |
          set -euo pipefail
          if [[ -n "$BASELINE_RELEASE" ]]; then
            tags="$BASELINE_RELEASE"
          else
            tags="$(gh release list --exclude-drafts --limit 50 --json tagName --jq '.[].tagName')"
          fi
          baseline=
          while IFS= read -r tag; do
            [[ "$tag" =~ ^opennest-v[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]{7}$ ]] || continue
            sha="$(git rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null)" || continue
            [[ "$sha" != "$GITHUB_SHA" ]] || continue
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA" || continue
            baseline="$sha"
            break
          done <<< "$tags"
          if [[ -z "$baseline" ]]; then
            echo "::error::Select a published OpenNest release that precedes this commit."
            exit 1
          fi
          gh release download "$tag" -p OpenNest-latest.json -D "$RUNNER_TEMP/opennest-baseline"
          manifest="$RUNNER_TEMP/opennest-baseline/OpenNest-latest.json"
          jq -er --arg sha "$baseline" --arg tag "$tag" '
            .applications.opennest as $app |
            ($app.runtime // "opencode") as $runtime |
            ($app.restartProtocolVersion // 0) as $protocol |
            select(.commit == $sha and ("opennest-v" + .version) == $tag and
              ($runtime == "opencode" or $runtime == "claude") and ($protocol == 0 or $protocol == 1) and
              ($app.installer.sha256 | test("^[a-f0-9]{64}$")) and
              $app.installer.url == "https://github.com/petrovichest/nest-apps/releases/download/\($tag)/install-opennest.sh") |
            "OPENNEST_QUALIFICATION_BASELINE=\($sha)",
            "OPENNEST_QUALIFICATION_BASELINE_KIND=published",
            "OPENNEST_QUALIFICATION_BASELINE_VERSION=\(.version)",
            "OPENNEST_QUALIFICATION_BASELINE_RUNTIME=\($runtime)",
            "OPENNEST_QUALIFICATION_BASELINE_INSTALLER_URL=\($app.installer.url)",
            "OPENNEST_QUALIFICATION_BASELINE_INSTALLER_SHA256=\($app.installer.sha256)",
            "OPENNEST_DIAGNOSTIC_ROLLING_BASELINE=\($protocol)"
          ' "$manifest" >> "$GITHUB_ENV"
      - name: Exercise native installation and recovery in isolation
        env:
          OPENNEST_DIAGNOSTIC_STARTUP_ONLY: ${{ inputs.diagnostic_scope == 'baseline' && '1' || '0' }}
        run: bash deploy/opennest/qualification/environment.sh
      - name: Validate full lifecycle measurements
        if: inputs.diagnostic_scope == 'full'
        run: |
          node --input-type=module - "$RUNNER_TEMP/opennest-qualification" <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { validateClaudeLifecycle, validateLifecycle } from './deploy/opennest/qualification/report.mjs';
          const directory = process.argv[2];
          const report = JSON.parse(readFileSync(join(directory, 'lifecycle.json')));
          const installer = readFileSync(join(directory, 'candidate-installer-sha256.txt'), 'utf8').split(/\s/)[0];
          validateLifecycle(report, process.env.GITHUB_SHA, process.env.OPENNEST_QUALIFICATION_BASELINE, installer);
          validateClaudeLifecycle(report);
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: opennest-native-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/opennest-qualification/
          if-no-files-found: error
          retention-days: 30
