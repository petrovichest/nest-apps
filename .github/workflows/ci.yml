name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-verify-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: NODE_ENV=test npm test
      - run: bash -n deploy/install.sh deploy/adopt-existing.sh deploy/adopt-existing.test.sh deploy/codexnest deploy/claudenest/install.sh deploy/claudenest/claudenest
      - run: deploy/adopt-existing.test.sh
      - name: Verify pinned Node.js checksums are published
        run: |
          node_version="$(sed -n 's/^codexnest_node_version="\([^" ]*\)"/\1/p' deploy/install.sh)"
          curl -fsSL "https://nodejs.org/dist/v${node_version}/SHASUMS256.txt" -o node-shasums.txt
          grep -Eq "^[0-9a-f]{64}  node-v${node_version}-linux-x64.tar.xz$" node-shasums.txt
          grep -Eq "^[0-9a-f]{64}  node-v${node_version}-linux-arm64.tar.xz$" node-shasums.txt
      - name: Package the verified browser extension
        if: github.event_name == 'push'
        run: |
          npm run package -w @codexnest/extension
          unzip -t apps/extension/artifacts/codexnest-browser-*.zip
          test -s apps/client/dist/index.html
          test -s apps/client/dist-claude/index.html
          test -s apps/server/dist/index.js
          test -s apps/claude-server/dist/index.js
      - name: Upload verified release inputs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nest-apps-build-${{ github.sha }}
          path: |
            apps/client/dist/
            apps/client/dist-claude/
            apps/server/dist/
            apps/claude-server/dist/
            apps/extension/artifacts/codexnest-browser-*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || 'rolling' }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check release source
        id: source
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
            git fetch --no-tags origin main
            git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" FETCH_HEAD
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
            echo "current=$([[ "$latest_sha" == "$GITHUB_SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.source.outputs.current == 'true'
        with:
          name: nest-apps-build-${{ github.sha }}
          path: apps
      - name: Prepare release assets
        if: steps.source.outputs.current == 'true'
        id: assets
        run: |
          version="$(node -p "require('./package.json').version")"
          ref="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            version="$version-${GITHUB_SHA::7}"
            ref="$GITHUB_SHA"
          fi
          mkdir -p release
          sed -e "s/^codexnest_default_version=.*/codexnest_default_version=\"$version\"/" \
              -e "s/^codexnest_default_ref=.*/codexnest_default_ref=\"$ref\"/" \
              deploy/install.sh > release/install.sh
          sed -e "s/^claudenest_default_version=.*/claudenest_default_version=\"$version\"/" \
              -e "s/^claudenest_default_ref=.*/claudenest_default_ref=\"$GITHUB_SHA\"/" \
              deploy/claudenest/install.sh > release/install-claudenest.sh
          chmod 0755 release/*.sh
          bash -n release/install.sh release/install-claudenest.sh
          printf '{"schemaVersion":1,"version":"%s","commit":"%s"}\n' "$version" "$GITHUB_SHA" > release/NestApps-latest.json
          cp release/NestApps-latest.json release/CodexNest-latest.json
          shopt -s nullglob
          archives=(apps/extension/artifacts/codexnest-browser-[0-9]*.zip)
          test "${#archives[@]}" -eq 1
          cp "${archives[0]}" release/
          cp "${archives[0]}" release/codexnest-browser-latest.zip
          unzip -t release/codexnest-browser-latest.zip
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        if: steps.source.outputs.current == 'true' && github.ref_type != 'tag'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - if: steps.source.outputs.current == 'true' && github.ref_type != 'tag'
        run: npm ci
      - if: steps.source.outputs.current == 'true' && github.ref_type != 'tag'
        run: npm run android:sync -w @codexnest/client
      - name: Validate Android signing secrets
        if: steps.source.outputs.current == 'true' && github.ref_type != 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.CODEXNEST_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CODEXNEST_ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.CODEXNEST_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CODEXNEST_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
      - name: Prepare Android signing key
        if: steps.source.outputs.current == 'true' && github.ref_type != 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.CODEXNEST_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codexnest.jks"
          chmod 0600 "$RUNNER_TEMP/codexnest.jks"
      - name: Test Android and build signed rolling APK
        if: steps.source.outputs.current == 'true' && github.ref_type != 'tag'
        env:
          CODEXNEST_KEYSTORE_PATH: ${{ runner.temp }}/codexnest.jks
          CODEXNEST_KEY_ALIAS: ${{ secrets.CODEXNEST_ANDROID_KEY_ALIAS }}
          CODEXNEST_KEYSTORE_PASSWORD: ${{ secrets.CODEXNEST_ANDROID_KEYSTORE_PASSWORD }}
          CODEXNEST_KEY_PASSWORD: ${{ secrets.CODEXNEST_ANDROID_KEY_PASSWORD }}
          CODEXNEST_ANDROID_VERSION_NAME: ${{ steps.assets.outputs.version }}
        run: |
          set -euo pipefail
          export CODEXNEST_ANDROID_VERSION_CODE="$((2000000 + GITHUB_RUN_NUMBER))"
          ./gradlew testDebugUnitTest assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk" || { printf 'Signed APK was not created at %s\n' "$apk" >&2; exit 1; }
          android_build_tools="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          if ! apk_signature="$("$android_build_tools/apksigner" verify --print-certs "$apk" 2>&1)"; then
            printf '%s\n' "$apk_signature" >&2
            exit 1
          fi
          printf '%s\n' "$apk_signature" | sed -n '/certificate SHA-256 digest:/p'
          apk_certificate="$(printf '%s\n' "$apk_signature" | sed -nE 's/^[[:space:]]*(V[0-9]+ )?Signer.* certificate SHA-256 digest: ([[:xdigit:]]{64})[[:space:]]*$/\2/p' | tr '[:upper:]' '[:lower:]' | sort -u)"
          signing_certificate="$RUNNER_TEMP/codexnest-signing-certificate.der"
          keytool -exportcert -keystore "$CODEXNEST_KEYSTORE_PATH" -alias "$CODEXNEST_KEY_ALIAS" -storepass:env CODEXNEST_KEYSTORE_PASSWORD -file "$signing_certificate"
          keystore_certificate="$(sha256sum "$signing_certificate" | cut -d ' ' -f 1)"
          rm -f -- "$signing_certificate"
          printf 'APK signing certificate SHA-256: %s\n' "$apk_certificate"
          printf 'Keystore certificate SHA-256: %s\n' "$keystore_certificate"
          test -n "$apk_certificate" || { printf 'APK signer certificate was not reported\n' >&2; exit 1; }
          test "$apk_certificate" = "$keystore_certificate" || { printf 'APK signer does not match the configured signing key\n' >&2; exit 1; }
          apk_metadata="$("$android_build_tools/aapt" dump badging "$apk" | sed -n '/^package:/p')"
          printf '%s\n' "$apk_metadata"
          [[ "$apk_metadata" == *"name='com.codexnest.app'"* ]]
          [[ "$apk_metadata" == *"versionCode='$CODEXNEST_ANDROID_VERSION_CODE'"* ]]
          [[ "$apk_metadata" == *"versionName='$CODEXNEST_ANDROID_VERSION_NAME'"* ]]
          cp "$apk" ../../../release/CodexNest-latest.apk
        working-directory: apps/client/android
      - name: Check main before rolling publication
        if: steps.source.outputs.current == 'true'
        id: publish
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]] || [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale rolling build $GITHUB_SHA"
          fi
      - name: Publish GitHub release
        if: steps.publish.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.assets.outputs.version }}
        run: |
          tag="$GITHUB_REF_NAME"
          latest=false
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            tag=rolling-latest
            latest=true
          fi
          release_assets=(release/install.sh release/install-claudenest.sh release/codexnest-browser-*.zip)
          printf 'CodexNest and ClaudeNest from verified commit `%s`.\n\nCodexNest: `curl -fsSL https://github.com/%s/releases/download/%s/install.sh | bash`\n\nClaudeNest: `curl -fsSL https://github.com/%s/releases/download/%s/install-claudenest.sh | bash`\n\nThe installers build the server and web client from this exact commit.\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$tag" "$GITHUB_REPOSITORY" "$tag" > release/notes.md
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            release_assets+=(release/CodexNest-latest.apk)
            printf '\nThe signed CodexNest Android APK and Chrome extension are built from the same verified commit.\n' >> release/notes.md
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${release_assets[@]}" --clobber
            if [[ "$GITHUB_REF_TYPE" != tag ]]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            fi
            gh release edit "$tag" --prerelease=false --latest="$latest" --title "Nest Apps $RELEASE_VERSION" --notes-file release/notes.md
          else
            gh release create "$tag" "${release_assets[@]}" --latest="$latest" --target "$GITHUB_SHA" --title "Nest Apps $RELEASE_VERSION" --notes-file release/notes.md
          fi
          # Publish both update pointers after the assets, with the authoritative one last.
          gh release upload "$tag" release/CodexNest-latest.json --clobber
          gh release upload "$tag" release/NestApps-latest.json --clobber
