name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-verify-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: NODE_ENV=test npm test
      - run: node --test deploy/qualification/report.test.mjs
      - run: bash -n deploy/install.sh deploy/adopt-existing.sh deploy/adopt-existing.test.sh deploy/codexnest deploy/claudenest/install.sh deploy/claudenest/claudenest deploy/gemininest/install.sh
      - run: deploy/adopt-existing.test.sh
      - name: Verify pinned Node.js checksums are published
        run: |
          node_version="$(sed -n 's/^codexnest_node_version="\([^" ]*\)"/\1/p' deploy/install.sh)"
          curl -fsSL "https://nodejs.org/dist/v${node_version}/SHASUMS256.txt" -o node-shasums.txt
          grep -Eq "^[0-9a-f]{64}  node-v${node_version}-linux-x64.tar.xz$" node-shasums.txt
          grep -Eq "^[0-9a-f]{64}  node-v${node_version}-linux-arm64.tar.xz$" node-shasums.txt
      - name: Package the verified browser extension
        if: github.event_name == 'push'
        run: |
          npm run package -w @codexnest/extension
          unzip -t apps/extension/artifacts/codexnest-browser-*.zip
          unzip -t apps/extension/artifacts/claudenest-browser-*.zip
          unzip -t apps/extension/artifacts/gemininest-browser-*.zip
          test -s apps/client/dist/index.html
          test -s apps/client/dist-claude/index.html
          test -s apps/client/dist-gemini/index.html
          test -s apps/server/dist/index.js
          test -s apps/server/dist/account-runtime-main.js
          test -s apps/claude-server/dist/index.js
          test -s apps/gemini-server/dist/daemon.js
          test -s apps/gemini-server/dist/index.js
      - name: Upload verified release inputs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nest-apps-build-${{ github.sha }}
          path: |
            apps/client/dist/
            apps/client/dist-gemini/
            apps/client/dist-claude/
            apps/server/dist/
            apps/gemini-server/dist/
            apps/claude-server/dist/
            apps/extension/artifacts/codexnest-browser-*.zip
            apps/extension/artifacts/claudenest-browser-*.zip
            apps/extension/artifacts/gemininest-browser-*.zip
          if-no-files-found: error
          retention-days: 1

  native-account-network:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codex: ["0.154.0", "0.167.0", "0.167.1", "0.167.2", "0.169.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @codexnest/protocol
      - run: npm run build -w @nest-apps/kanban
      - run: npm run build -w @codexnest/server
      - name: Install the exact isolated native runtime
        env:
          NATIVE_VERSION: ${{ matrix.codex }}
        run: |
          npm install --prefix "$RUNNER_TEMP/account-native" --ignore-scripts --no-audit --no-fund "@openai/codex@$NATIVE_VERSION"
          "$RUNNER_TEMP/account-native/node_modules/.bin/codex" --version | grep -Fx "codex-cli $NATIVE_VERSION"
      - name: Prove per-account egress with real native HTTP, TLS, WebSocket and OAuth
        env:
          NODE_ENV: test
          CODEXNEST_ACCOUNT_CODEX_BIN: ${{ runner.temp }}/account-native/node_modules/.bin/codex
          CODEXNEST_ACCOUNT_WORKER: ${{ github.workspace }}/apps/server/dist/account-runtime-main.js
        run: |
          test -x "$CODEXNEST_ACCOUNT_CODEX_BIN"
          npm run test -w @codexnest/server -- src/account-proxy.integration.test.ts src/codex-accounts.integration.test.ts --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/account-network.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: account-network-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.codex }}
          path: ${{ runner.temp }}/account-network.xml
          if-no-files-found: error

  release-environment:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        codex: ["0.154.0", "0.167.0", "0.167.1", "0.167.2", "0.169.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove isolated systemd and the actual native daemon
        env:
          NATIVE_VERSION: ${{ matrix.codex }}
        run: bash deploy/qualification/environment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-environment-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.codex }}
          path: ${{ runner.temp }}/qualification-environment-${{ matrix.codex }}/
          if-no-files-found: error

  release-lifecycle-diagnostics:
    if: github.event_name == 'workflow_dispatch'
    needs:
      [
        verify,
        native-account-network,
        release-clean-install-diagnostics,
        release-interruption-diagnostics,
        release-unsupported-native-diagnostics,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        codex: ["0.167.0", "0.167.1", "0.167.2", "0.169.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise the real installer, installed updater and automatic rollback
        env:
          NATIVE_VERSION: ${{ matrix.codex }}
          QUALIFICATION_MODE: lifecycle
        run: bash deploy/qualification/environment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lifecycle-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.codex }}
          path: ${{ runner.temp }}/qualification-lifecycle-${{ matrix.codex }}/
          if-no-files-found: error

  release-clean-install-diagnostics:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the exact candidate into an empty isolated HOME
        env:
          NATIVE_VERSION: "0.169.0"
          QUALIFICATION_MODE: lifecycle
          QUALIFICATION_SCOPE: clean
        run: bash deploy/qualification/environment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: clean-install-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qualification-lifecycle-0.169.0/
          if-no-files-found: error

  release-interruption-diagnostics:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - codex: "0.167.2"
            baseline: current
          - codex: "0.169.0"
            baseline: current
          - codex: "0.169.0"
            baseline: incident
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Interrupt the actual old updater and candidate at update boundaries
        env:
          NATIVE_VERSION: ${{ matrix.codex }}
          QUALIFICATION_MODE: lifecycle
          QUALIFICATION_SCOPE: interruption
          QUALIFICATION_BASELINE: ${{ matrix.baseline }}
        run: bash deploy/qualification/environment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: interruption-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.codex }}-${{ matrix.baseline }}
          path: ${{ runner.temp }}/qualification-lifecycle-${{ matrix.codex }}/
          if-no-files-found: error

  release-unsupported-native-diagnostics:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse the old native runtime before switching the installed release
        env:
          NATIVE_VERSION: "0.154.0"
          QUALIFICATION_MODE: lifecycle
          QUALIFICATION_SCOPE: unsupported
        run: bash deploy/qualification/environment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unsupported-native-diagnostics-${{ github.sha }}-0.154.0
          path: ${{ runner.temp }}/qualification-lifecycle-0.154.0/
          if-no-files-found: error

  release-report:
    if: github.event_name == 'workflow_dispatch'
    needs:
      [
        verify,
        native-account-network,
        release-environment,
        release-lifecycle-diagnostics,
        release-clean-install-diagnostics,
        release-interruption-diagnostics,
        release-unsupported-native-diagnostics,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: qualification-evidence
      - name: Validate every mandatory native scope for this exact commit
        run: |
          sed -e "s/^codexnest_default_version=.*/codexnest_default_version=\"0.1.9-${GITHUB_SHA::7}\"/" \
              -e "s/^codexnest_default_ref=.*/codexnest_default_ref=\"$GITHUB_SHA\"/" \
              deploy/install.sh > "$RUNNER_TEMP/candidate-install.sh"
          installer_hash="$(sha256sum "$RUNNER_TEMP/candidate-install.sh" | cut -d ' ' -f 1)"
          node deploy/qualification/report.mjs collect qualification-evidence "$GITHUB_SHA" "$installer_hash"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-release-${{ github.sha }}
          path: qualification.json
          if-no-files-found: error
          retention-days: 30

  # Publication accepts only a complete successful manual matrix at the same SHA.
  # Source/account tests alone cannot create the immutable qualification artifact.
  release-qualification:
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.verify.result == 'success' && needs.native-account-network.result == 'success'
    needs: [verify, native-account-network, release-report]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.qualified.outputs.run-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Require successful native qualification and unchanged healthy baseline
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" != tag || { echo '::error::Version-tag installer packaging needs its own native qualification; only rolling packaging is qualified here.'; exit 1; }
          qualified_run="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event workflow_dispatch --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$qualified_run" || { echo '::error::No complete successful native matrix for this exact commit.'; exit 1; }
          gh run download "$qualified_run" -R "$GITHUB_REPOSITORY" -n "qualified-release-$GITHUB_SHA" -D "$RUNNER_TEMP/qualified-release"
          sed -e "s/^codexnest_default_version=.*/codexnest_default_version=\"0.1.9-${GITHUB_SHA::7}\"/" \
              -e "s/^codexnest_default_ref=.*/codexnest_default_ref=\"$GITHUB_SHA\"/" \
              deploy/install.sh > "$RUNNER_TEMP/candidate-install.sh"
          installer_hash="$(sha256sum "$RUNNER_TEMP/candidate-install.sh" | cut -d ' ' -f 1)"
          QUALIFIED_RUN_ID="$qualified_run" node deploy/qualification/report.mjs check "$RUNNER_TEMP/qualified-release" "$GITHUB_SHA" "$installer_hash"
          curl -fsSL --retry 2 --max-time 30 "https://github.com/$GITHUB_REPOSITORY/releases/download/rolling-latest/NestApps-latest.json" -o "$RUNNER_TEMP/published.json"
          node --input-type=module - "$RUNNER_TEMP/published.json" "$RUNNER_TEMP/qualified-release/qualification.json" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const [published, qualification] = process.argv.slice(2).map(path => JSON.parse(readFileSync(path, 'utf8')));
          assert.equal(published.commit, qualification.baseline, 'Healthy baseline moved; qualify the new upgrade path first');
          JS
          echo "run-id=$qualified_run" >> "$GITHUB_OUTPUT"

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [verify, native-account-network, release-qualification]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || 'rolling' }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check release source
        id: source
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
            git fetch --no-tags origin main
            git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" FETCH_HEAD
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
            echo "current=$([[ "$latest_sha" == "$GITHUB_SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.source.outputs.current == 'true'
        with:
          name: nest-apps-build-${{ github.sha }}
          path: apps
      - name: Prepare release assets
        if: steps.source.outputs.current == 'true'
        id: assets
        run: |
          version="$(node -p "require('./package.json').version")"
          ref="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            version="$version-${GITHUB_SHA::7}"
            ref="$GITHUB_SHA"
          fi
          mkdir -p release
          sed -e "s/^codexnest_default_version=.*/codexnest_default_version=\"$version\"/" \
              -e "s/^codexnest_default_ref=.*/codexnest_default_ref=\"$ref\"/" \
              deploy/install.sh > release/install.sh
          sed -e "s/^claudenest_default_version=.*/claudenest_default_version=\"$version\"/" \
              -e "s/^claudenest_default_ref=.*/claudenest_default_ref=\"$GITHUB_SHA\"/" \
              deploy/claudenest/install.sh > release/install-claudenest.sh
          sed -e "s/^gemininest_default_version=.*/gemininest_default_version=\"$version\"/" \
              -e "s/^gemininest_default_ref=.*/gemininest_default_ref=\"$GITHUB_SHA\"/" \
              deploy/gemininest/install.sh > release/install-gemininest.sh
          chmod 0755 release/*.sh
          bash -n release/install.sh release/install-claudenest.sh release/install-gemininest.sh
          printf '{"schemaVersion":1,"version":"%s","commit":"%s"}\n' "$version" "$GITHUB_SHA" > release/NestApps-latest.json
          cp release/NestApps-latest.json release/CodexNest-latest.json
          shopt -s nullglob
          archives=(apps/extension/artifacts/codexnest-browser-[0-9]*.zip)
          test "${#archives[@]}" -eq 1
          cp "${archives[0]}" release/
          cp "${archives[0]}" release/codexnest-browser-latest.zip
          unzip -t release/codexnest-browser-latest.zip
          claude_archives=(apps/extension/artifacts/claudenest-browser-[0-9]*.zip)
          test "${#claude_archives[@]}" -eq 1
          cp "${claude_archives[0]}" release/
          cp "${claude_archives[0]}" release/claudenest-browser-latest.zip
          unzip -t release/claudenest-browser-latest.zip
          gemini_archives=(apps/extension/artifacts/gemininest-browser-[0-9]*.zip)
          test "${#gemini_archives[@]}" -eq 1
          cp "${gemini_archives[0]}" release/
          cp "${gemini_archives[0]}" release/gemininest-browser-latest.zip
          unzip -t release/gemininest-browser-latest.zip
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.source.outputs.current == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.release-qualification.outputs.run-id }}
          name: qualified-release-${{ github.sha }}
          path: release
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        if: steps.source.outputs.current == 'true' && github.ref_type != 'tag'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - if: steps.source.outputs.current == 'true' && github.ref_type != 'tag'
        run: npm ci
      - name: Validate Android signing secrets
        if: steps.source.outputs.current == 'true' && github.ref_type != 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.CODEXNEST_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CODEXNEST_ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.CODEXNEST_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CODEXNEST_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
      - name: Prepare Android signing key
        if: steps.source.outputs.current == 'true' && github.ref_type != 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.CODEXNEST_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codexnest.jks"
          chmod 0600 "$RUNNER_TEMP/codexnest.jks"
      - name: Test Android and build signed rolling APKs
        if: steps.source.outputs.current == 'true' && github.ref_type != 'tag'
        env:
          CODEXNEST_KEYSTORE_PATH: ${{ runner.temp }}/codexnest.jks
          CODEXNEST_KEY_ALIAS: ${{ secrets.CODEXNEST_ANDROID_KEY_ALIAS }}
          CODEXNEST_KEYSTORE_PASSWORD: ${{ secrets.CODEXNEST_ANDROID_KEYSTORE_PASSWORD }}
          CODEXNEST_KEY_PASSWORD: ${{ secrets.CODEXNEST_ANDROID_KEY_PASSWORD }}
          CODEXNEST_ANDROID_VERSION_NAME: ${{ steps.assets.outputs.version }}
        run: |
          set -euo pipefail
          export CODEXNEST_ANDROID_VERSION_CODE="$((2000000 + GITHUB_RUN_NUMBER))"
          android_build_tools="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          signing_certificate="$RUNNER_TEMP/codexnest-signing-certificate.der"
          keytool -exportcert -keystore "$CODEXNEST_KEYSTORE_PATH" -alias "$CODEXNEST_KEY_ALIAS" -storepass:env CODEXNEST_KEYSTORE_PASSWORD -file "$signing_certificate"
          keystore_certificate="$(sha256sum "$signing_certificate" | cut -d ' ' -f 1)"
          rm -f -- "$signing_certificate"
          printf 'Keystore certificate SHA-256: %s\n' "$keystore_certificate"
          for provider in codex claude gemini; do
            export NEST_APP_PROVIDER="$provider"
            app_name=CodexNest
            application_id=com.codexnest.app
            if [[ "$provider" == claude ]]; then
              app_name=ClaudeNest
              application_id=com.claudenest.app
            fi
            if [[ "$provider" == gemini ]]; then
              app_name=GeminiNest
              application_id=com.gemininest.app
            fi
            npm --prefix .. run android:sync
            ./gradlew testDebugUnitTest assembleRelease
            apk=app/build/outputs/apk/release/app-release.apk
            test -s "$apk" || { printf 'Signed APK was not created at %s\n' "$apk" >&2; exit 1; }
            if ! apk_signature="$("$android_build_tools/apksigner" verify --print-certs "$apk" 2>&1)"; then
              printf '%s\n' "$apk_signature" >&2
              exit 1
            fi
            apk_certificate="$(printf '%s\n' "$apk_signature" | sed -nE 's/^[[:space:]]*(V[0-9]+ )?Signer.* certificate SHA-256 digest: ([[:xdigit:]]{64})[[:space:]]*$/\2/p' | tr '[:upper:]' '[:lower:]' | sort -u)"
            printf '%s APK signing certificate SHA-256: %s\n' "$app_name" "$apk_certificate"
            test -n "$apk_certificate" || { printf 'APK signer certificate was not reported\n' >&2; exit 1; }
            test "$apk_certificate" = "$keystore_certificate" || { printf 'APK signer does not match the configured signing key\n' >&2; exit 1; }
            apk_metadata="$("$android_build_tools/aapt" dump badging "$apk" | sed -n '/^package:/p')"
            printf '%s\n' "$apk_metadata"
            [[ "$apk_metadata" == *"name='$application_id'"* ]]
            [[ "$apk_metadata" == *"versionCode='$CODEXNEST_ANDROID_VERSION_CODE'"* ]]
            [[ "$apk_metadata" == *"versionName='$CODEXNEST_ANDROID_VERSION_NAME'"* ]]
            unzip -p "$apk" assets/capacitor.config.json | node -e 'let text = ""; process.stdin.on("data", chunk => text += chunk); process.stdin.on("end", () => { if (JSON.parse(text).appId !== process.argv[1]) process.exit(1); });' "$application_id"
            if [[ "$provider" == gemini ]]; then
              unzip -p "$apk" assets/public/index.html | grep -F 'data-application="gemininest"' > /dev/null
            elif [[ "$provider" == claude ]]; then
              unzip -p "$apk" assets/public/index.html | grep -F 'data-application="claudenest"' > /dev/null
            else
              if unzip -p "$apk" assets/public/index.html | grep -F 'data-application="claudenest"' > /dev/null; then
                printf 'CodexNest APK contains the ClaudeNest web client\n' >&2
                exit 1
              fi
            fi
            cp "$apk" "../../../release/$app_name-latest.apk"
          done
        working-directory: apps/client/android
      - name: Check main before rolling publication
        if: steps.source.outputs.current == 'true'
        id: publish
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]] || [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale rolling build $GITHUB_SHA"
          fi
      - name: Publish GitHub release
        if: steps.publish.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.assets.outputs.version }}
        run: |
          tag="$GITHUB_REF_NAME"
          latest=false
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            tag=rolling-latest
            latest=true
          fi
          release_assets=(release/install.sh release/install-claudenest.sh release/install-gemininest.sh release/qualification.json release/codexnest-browser-*.zip release/claudenest-browser-*.zip release/gemininest-browser-*.zip)
          printf 'CodexNest and ClaudeNest from verified commit `%s`.\n\nCodexNest: `curl -fsSL https://github.com/%s/releases/download/%s/install.sh | bash`\n\nClaudeNest: `curl -fsSL https://github.com/%s/releases/download/%s/install-claudenest.sh | bash`\n\nThe installers build the server and web client from this exact commit.\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$tag" "$GITHUB_REPOSITORY" "$tag" > release/notes.md
          printf '\nGeminiNest (Google AI Ultra through Antigravity ACP): `curl -fsSL https://github.com/%s/releases/download/%s/install-gemininest.sh | bash`\n' "$GITHUB_REPOSITORY" "$tag" >> release/notes.md
          printf '\nCodexNest requires Codex CLI 0.167.0 or newer. Older CLI updates are refused before switching the installed application.\n' >> release/notes.md
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            release_assets+=(release/CodexNest-latest.apk release/ClaudeNest-latest.apk release/GeminiNest-latest.apk)
            printf '\nThe signed CodexNest, ClaudeNest and GeminiNest Android APKs and the CodexNest, ClaudeNest and GeminiNest Chrome extensions are built from the same verified commit.\n' >> release/notes.md
          fi
          sha256sum "${release_assets[@]}" release/CodexNest-latest.json release/NestApps-latest.json | sed 's@  release/@  @' > release/SHA256SUMS
          release_assets+=(release/SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${release_assets[@]}" --clobber
            if [[ "$GITHUB_REF_TYPE" != tag ]]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            fi
            gh release edit "$tag" --prerelease=false --latest="$latest" --title "Nest Apps $RELEASE_VERSION" --notes-file release/notes.md
          else
            gh release create "$tag" "${release_assets[@]}" --latest="$latest" --target "$GITHUB_SHA" --title "Nest Apps $RELEASE_VERSION" --notes-file release/notes.md
          fi
          # Publish both update pointers after the assets, with the authoritative one last.
          gh release upload "$tag" release/CodexNest-latest.json --clobber
          gh release upload "$tag" release/NestApps-latest.json --clobber
